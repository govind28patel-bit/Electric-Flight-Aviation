function Tag({ k }: { k: string }) {

}
function Counter({ to, prefix = '', suffix = '', dec = 0, dur = 1400 }: any) {
  const [v, setV] = useState(to);
  const ref = useRef<HTMLSpanElement>(null);
  useEffect(() => {
    const el = ref.current; if (!el) return; let done = false;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !done) { done = true; const t0 = performance.now();
        const step = (t: number) => { const p = Math.min(1, (t - t0) / dur); setV(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
        setV(0); requestAnimationFrame(step); }
    }, { threshold: .4 });
    io.observe(el); return () => io.disconnect();
  }, [to]);
  return <span ref={ref} className="tnum">{prefix}{dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-IN')}{suffix}</span>;
}

      <p className="text-gray-600 mt-3 max-w-2xl">Fresh secondary research gathered for this study in October 2026. Personas and emotion scores are hypotheses until interviews.</p>
      <ol className="mt-8 grid md:grid-cols-2 gap-x-10 gap-y-3">{SRC.map((s, i) => <li key={i} id={'src-' + (i + 1)} className="flex gap-3 text-sm scroll-mt-24"><span className="text-gray-400 tnum w-6 flex-none">{i + 1}.</span><a href={s.u} target="_blank" rel="noopener noreferrer" className="text-gray-800 hover:underline min-w-0 break-words">{s.t} <ExternalLink size={12} className="inline -mt-0.5" /></a></li>)}</ol>
    </div></div></section>
  );
}

/* ================= APP ================= */
function useActive(ids: string[]) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }), { rootMargin: '-45% 0px -50% 0px' });
    ids.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);
  return active;
}
function App() {
  const ids = CHAPTERS.map(c => c.id);
  const active = useActive(ids);
  const [notes, setNotes] = useState(false);
  const idx = Math.max(0, ids.indexOf(active));
  const step = useCallback((d: number) => { const n = Math.min(ids.length - 1, Math.max(0, idx + d)); go(ids[n]); }, [idx]);
  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      const tg = e.target as HTMLElement; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'VIDEO')) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
      else if (e.key.toLowerCase() === 'n') setNotes(v => !v);
    };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  }, [step]);
  const ch = CHAPTERS[idx];
  return (
    <div className="min-h-screen bg-gray-50">
      <div className="fixed top-0 left-0 right-0 h-1 z-50"><div className="h-full bg-[#202A36] transition-all duration-500" style={{ width: ((idx + 1) / ids.length * 100) + '%' }}></div></div>
      <Hero onPresent={() => { setNotes(true); go('brief'); }} />
      <Brief /><Context /><Tech /><Research /><People /><AsIs /><Insight /><Ideas /><ToBe /><Storyboard /><Films /><CardSection /><Hold /><Green /><Design /><Measure /><Next /><Sources />
      <div className="h-24 bg-white"></div>
      <nav aria-label="Chapters" className="hidden xl:flex fixed right-5 top-1/2 -translate-y-1/2 z-40 flex-col gap-2">
        {CHAPTERS.map((c, j) => <a key={c.id} href={'#' + c.id} onClick={(e) => { e.preventDefault(); go(c.id); }} className="group flex items-center justify-end gap-2" aria-label={c.label}><span className="opacity-0 group-hover:opacity-100 transition-opacity text-xs font-medium bg-white/90 backdrop-blur px-2 py-1 rounded-md shadow-sm text-gray-800">{c.label}</span><span className="block rounded-full transition-all" style={{ width: j === idx ? 10 : 6, height: j === idx ? 10 : 6, background: j === idx ? '#202A36' : 'rgba(32,42,54,.25)' }}></span></a>)}
      </nav>
      {notes && (
        <aside className="fixed z-40 right-4 bottom-24 w-[min(380px,calc(100vw-32px))] rounded-2xl bg-white/95 backdrop-blur shadow-2xl border border-[#D9DDE4] p-5 fade-in" aria-live="polite">
          <div className="flex justify-between items-center"><span className="text-xs font-semibold uppercase tracking-wider text-gray-500">Talking points · {ch.label}</span><button onClick={() => setNotes(false)} aria-label="Hide talking points" className="p-1 -m-1 text-gray-500 hover:text-gray-900"><X size={16} /></button></div>
          <div className="mt-2 text-[15px] font-semibold text-gray-900 leading-snug">{ch.line}</div>
          <ul className="mt-3 grid gap-2">{ch.notes.map((n, k) => <li key={k} className="flex gap-2 text-sm text-gray-700 leading-snug"><span className="text-gray-400 tnum">{k + 1}</span><span>{n}</span></li>)}</ul>
        </aside>
      )}
      <div className="fixed z-40 left-1/2 -translate-x-1/2 bottom-4 flex items-center gap-1 rounded-full bg-[#202A36]/95 backdrop-blur text-white p-1.5 shadow-xl" style={{ marginBottom: 'env(safe-area-inset-bottom,0px)' }}>
        <button onClick={() => step(-1)} aria-label="Previous chapter" className="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center"><ChevronLeft size={18} /></button>
        <span className="px-2 text-sm tnum whitespace-nowrap"><b>{String(idx + 1).padStart(2, '0')}</b><span className="text-white/50"> / {ids.length}</span><span className="hidden sm:inline text-white/80"> · {ch.label}</span></span>
        <button onClick={() => step(1)} aria-label="Next chapter" className="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center"><ChevronRight size={18} /></button>
        <button onClick={() => setNotes(!notes)} aria-pressed={notes} className={'h-10 px-4 rounded-full text-sm font-medium flex items-center gap-2 transition-colors ' + (notes ? 'bg-white text-[#202A36]' : 'hover:bg-white/10')}><StickyNote size={16} /><span className="hidden sm:inline">Notes</span></button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')!).render(<App />);
</script>

(function () {
  try {
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, { presets: [['typescript', { isTSX: true, allExtensions: true }], 'react'], filename: 'app.tsx' }).code;
    (new Function(out))();
  } catch (e) {
    document.getElementById('root').innerHTML = '<p style="padding:24px;font-family:system-ui">The case study could not start: ' + String(e && e.message || e).replace(/</g, '&lt;') + '</p>';

  }
})();
</script>
